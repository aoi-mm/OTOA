backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "works"
    label: "Works"
    folder: "content/works"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: "title", label: "施設名", widget: "string" }
      - { name: "category", label: "カテゴリー", widget: "select", options: ["INTERIOR", "SPEAKER", "OTHER"] }
      - { name: "description", label: "説明文", widget: "string" }
      - name: "gallery"
        label: "ギャラリー"
        widget: "list"
        hint: "最大10枚までアップロードできます"
        fields:
          - { name: "image", label: "画像", widget: "image" }
          - { name: "caption", label: "キャプション", widget: "string", required: false }
      - { name: "date", label: "日付", widget: "datetime" }
      - { name: "body", label: "本文", widget: "markdown" }
